[package]
name = "vpn-tool"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "vpn-tool"
path = "src/main.rs"

[dependencies]
cli_engine = "0.1.0" # Adjust version if sourced locally or from a registry
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
